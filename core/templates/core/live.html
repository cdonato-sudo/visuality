{% extends "core/base.html" %}
{% block title %}Pantalla en vivo{% endblock %}

{% block content %}
<h1 class="mb-4">Pantalla en vivo</h1>

<div class="mb-4">
  <video id="player"
         class="w-100"
         autoplay
         muted
         playsinline>
    Tu navegador no soporta video.
  </video>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const player = document.getElementById("player");
  const BASE = "{{ base_video_url }}";
  let playingBase = true;
  let currentUserVideoId = null;

  function play(url) {
    player.src = url;
    player.load();
    const p = player.play();
    if (p) p.catch(() => {});
  }

  function playBase() {
    playingBase = true;
    currentUserVideoId = null;
    play(BASE);
  }

  async function markPlayed(id) {
    try {
      await fetch(`/mark_played/${id}/`, { method: "POST" });
    } catch (e) {}
  }

  async function checkNext() {
    // si ya está reproduciendo video de usuario, no interrumpimos
    if (!playingBase) return;

    try {
      const res = await fetch("/api/next-video/", { cache: "no-store" });
      const data = await res.json();

      if (data.next && data.next.url) {
        playingBase = false;
        currentUserVideoId = data.next.id;
        play(data.next.url);
      }
    } catch (e) {
      // si falla la consulta, no hacemos nada
    }
  }

  // cuando termina:
  player.addEventListener("ended", async () => {
    if (!playingBase && currentUserVideoId) {
      await markPlayed(currentUserVideoId);
      playBase();
    } else {
      // base terminó, la volvemos a reproducir
      playBase();
    }
  });

  // iniciar con base
  playBase();

  // polling cada 4 segundos
  setInterval(checkNext, 4000);
});
</script>
{% endblock %}
