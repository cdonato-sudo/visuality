{% extends "core/base.html" %}
{% block title %}Pantalla en vivo{% endblock %}

{% block content %}

<h1 class="mb-4">Pantalla en vivo</h1>

<div class="mb-4">
  <video
    id="player"
    class="w-100"
    autoplay
    muted
    playsinline
    controls
  >
    {% if next_video %}
      <source src="{{ next_video.archivo.url }}" type="video/mp4">
    {% else %}
      <source src="{{ base_video_url }}" type="video/mp4">
    {% endif %}
    Tu navegador no soporta la reproducción de video.
  </video>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const player = document.getElementById("player");

    const baseUrl = "{{ base_video_url }}";

    const hasNext = {% if next_video %}true{% else %}false{% endif %};
    const nextUrl = "{% if next_video %}{{ next_video.archivo.url }}{% endif %}";
    const nextId  = {% if next_video %}{{ next_video.id }}{% else %}null{% endif %};

    function play(url) {
      if (!url) return;
      player.src = url;
      player.load();

      const p = player.play();
      if (p !== undefined) {
        p.catch(() => {});
      }
    }

    // Si no hay video de usuario, aseguramos reproducir el base
    if (!hasNext) {
      play(baseUrl);
    }

    // Cuando termina un video
    player.addEventListener("ended", async function () {
      if (hasNext && nextId) {
        // Avisamos al backend que este video ya se reprodujo
        try {
          await fetch(`/mark_played/${nextId}/`, {
            method: "POST"
          });
        } catch (e) {}

        // Volvemos al video base
        play(baseUrl);
      } else {
        // Si era el video base, lo repetimos
        play(baseUrl);
      }
    });
  });
</script>

{% endblock %}
