{% extends "core/base.html" %}
{% block title %}Pantalla en vivo{% endblock %}

{% block content %}
<h1 class="mb-4">Pantalla en vivo</h1>

<div class="mb-4">
  <video id="player"
         class="w-100"
         controls
         autoplay
         muted
         playsinline>
    Tu navegador no soporta video.
  </video>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const player = document.getElementById("player");
    const baseUrl = "{{ base_video_url }}";

    // Si hay video pendiente, usamos ese; si no, base.
    const nextUrl = {% if next_video %}"{{ next_video.archivo.url }}"{% else %}null{% endif %};
    const nextId  = {% if next_video %}{{ next_video.id }}{% else %}null{% endif %};

    function play(url) {
      player.src = url;
      player.load();
      const p = player.play();
      if (p !== undefined) p.catch(()=>{});
    }

    // Arranque: si hay next, reproducilo. Si no, base.
    play(nextUrl || baseUrl);

    // Si el video falla (404, etc), volvemos al base
    player.addEventListener("error", function () {
      play(baseUrl);
    });

    // Al terminar:
    // - si era el next video, lo marcamos reproducido y volvemos al base
    // - si era el base, lo repetimos
    player.addEventListener("ended", function () {
      if (nextId && player.src.includes(nextUrl)) {
        fetch("/mark_played/" + nextId + "/", { method: "POST" })
          .catch(()=>{})
          .finally(()=> play(baseUrl));
      } else {
        play(baseUrl);
      }
    });
  });
</script>
{% endblock %}
